name: iOS
on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
jobs:
  web-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Telegram callback and WebView session integration
        run: node --import tsx tests/native-auth.integration.ts
      - name: Summary delivery regression checks
        run: node --import tsx tests/digest-settings.test.ts
  build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate class selection and time boundaries
        run: |
          swiftc ios/Shared/WidgetModels.swift ios/Shared/ClassActivityPlan.swift ios/Tests/ClassActivityPlanTests.swift -o /tmp/class-plan-tests
          TZ=America/Los_Angeles /tmp/class-plan-tests
      - name: Validate startup cache timezone and profile isolation
        run: |
          swiftc ios/Shared/WidgetModels.swift ios/Shared/ClassActivityPlan.swift ios/Shared/WidgetEnvironment.swift ios/Shared/WidgetStore.swift ios/Tests/WidgetStoreTests.swift -o /tmp/widget-store-tests
          TZ=America/Los_Angeles /tmp/widget-store-tests
      - name: Build app and embedded WidgetKit extension
        run: |
          xcodebuild -version
          xcodebuild -project ios/Schedule214.xcodeproj -target Schedule214 -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
