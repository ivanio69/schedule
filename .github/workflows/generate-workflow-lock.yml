name: Generate workflow lock
on:
  push:
    branches:
      - tmp/workflow-lock-533
permissions:
  contents: write
jobs:
  lock:
    if: "!contains(github.event.head_commit.message, '[lock-generated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/workflow-lock-533
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - run: |
          if git diff --quiet package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "[lock-generated] workflow dependency"
          git push
