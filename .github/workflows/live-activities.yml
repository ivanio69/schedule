name: Live Activity scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: live-activity-scheduler
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger Live Activity endpoint
        env:
          LIVE_ACTIVITY_URL: https://schedule-five-roan.vercel.app/api/cron/live-activities
        shell: bash
        run: |
          set -euo pipefail
          TOKEN_JSON="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=schedule-live-activities")"
          TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$TOKEN_JSON")"
          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" "$LIVE_ACTIVITY_URL"
